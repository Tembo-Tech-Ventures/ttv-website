name: Cloudflare Agent Environment Cleanup

on:
  schedule:
    # Backstop missed PR-close teardown and abandoned direct-agent previews.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      execute:
        description: Delete eligible environments after the dry-run policy check
        required: true
        type: boolean
        default: false
      max_age_hours:
        description: Minimum inactive age; the script refuses values below six
        required: true
        type: string
        default: "72"
      exclude:
        description: Comma-separated active agent environment names
        required: false
        type: string
        default: ""

jobs:
  sweep:
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: ttv-cloudflare-agent-cleanup
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_APP_NAME: ttv-website
      CLOUDFLARE_PROTECTED_ENVIRONMENTS: production,prod,staging
      # Manual runs remain dry-run-first; the daily backstop deletes only stacks
      # that pass the age, prefix, protected-name, and open-PR guards.
      SWEEP_EXECUTE: ${{ github.event_name == 'schedule' && 'true' || inputs.execute }}
      SWEEP_MAX_AGE_HOURS: ${{ github.event_name == 'schedule' && '72' || inputs.max_age_hours }}
      SWEEP_EXCLUDE: ${{ inputs.exclude }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Protect open pull request previews
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          open_prs="$(gh pr list --state open --limit 200 --json number --jq 'map("agent-pr-" + (.number | tostring)) | join(",")')"
          echo "open_prs=${open_prs}" >> "${GITHUB_OUTPUT}"

      - name: Sweep inactive isolated environments
        env:
          OPEN_PR_EXCLUSIONS: ${{ steps.active.outputs.open_prs }}
        shell: bash
        run: |
          args=("--max-age-hours=${SWEEP_MAX_AGE_HOURS}")
          if [[ "${SWEEP_EXECUTE}" == "true" ]]; then
            args+=("--execute")
          fi
          exclusions="${SWEEP_EXCLUDE}"
          if [[ -n "${OPEN_PR_EXCLUSIONS}" ]]; then
            exclusions="${exclusions:+${exclusions},}${OPEN_PR_EXCLUSIONS}"
          fi
          if [[ -n "${exclusions}" ]]; then
            args+=("--exclude=${exclusions}")
          fi
          npm run cf:sweep -- "${args[@]}"
