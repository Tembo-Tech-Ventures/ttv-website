name: Cloudflare Agent Environment Cleanup

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Delete eligible environments after the dry-run policy check
        required: true
        type: boolean
        default: false
      max_age_hours:
        description: Minimum inactive age; the script refuses values below six
        required: true
        type: string
        default: "72"
      exclude:
        description: Comma-separated active agent environment names
        required: false
        type: string
        default: ""

jobs:
  sweep:
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: ttv-cloudflare-agent-cleanup
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_APP_NAME: ttv-website
      CLOUDFLARE_PROTECTED_ENVIRONMENTS: production,prod,staging
      SWEEP_EXECUTE: ${{ inputs.execute }}
      SWEEP_MAX_AGE_HOURS: ${{ inputs.max_age_hours }}
      SWEEP_EXCLUDE: ${{ inputs.exclude }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Sweep inactive isolated environments
        shell: bash
        run: |
          args=("--max-age-hours=${SWEEP_MAX_AGE_HOURS}")
          if [[ "${SWEEP_EXECUTE}" == "true" ]]; then
            args+=("--execute")
          fi
          if [[ -n "${SWEEP_EXCLUDE}" ]]; then
            args+=("--exclude=${SWEEP_EXCLUDE}")
          fi
          npm run cf:sweep -- "${args[@]}"
