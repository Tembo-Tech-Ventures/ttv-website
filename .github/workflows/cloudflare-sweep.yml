name: One-shot approved stale gateways
on:
  workflow_dispatch:
    inputs:
      execute:
        type: boolean
        default: false
        required: true
jobs:
  reclaim:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: ttv-one-shot-gateways
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test web/scripts/cloudflare/one-shot-gateways.test.mjs
      - name: Reclaim approved gateways and diagnose R2 metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          EXECUTE: ${{ inputs.execute }}
        run: |
          if [ "$EXECUTE" = true ]; then
            node web/scripts/cloudflare/one-shot-gateways.mjs --execute
          else
            node web/scripts/cloudflare/one-shot-gateways.mjs
          fi
