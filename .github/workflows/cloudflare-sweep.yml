name: Cloudflare Agent Environment Cleanup

# OPS BRANCH ONLY (sam/ops-reclaim-ai-gateways): gateway-only reclaim of closed
# PR preview AI Gateways, under the owner's 2026-10-31 standing order. Not for
# merge; main keeps the full sweep.
on:
  workflow_dispatch:
    inputs:
      execute:
        description: Delete the closed-PR gateways the dry run lists
        required: true
        type: boolean
        default: false
      keep:
        description: Comma-separated agent environments to keep in addition to open PRs
        required: false
        type: string
        default: ""

jobs:
  reclaim:
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: ttv-cloudflare-agent-cleanup
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RECLAIM_EXECUTE: ${{ inputs.execute }}
      RECLAIM_KEEP: ${{ inputs.keep }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Protect open pull request previews
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          open_prs="$(gh pr list --state open --limit 200 --json number --jq 'map("agent-pr-" + (.number | tostring)) | join(",")')"
          echo "open_prs=${open_prs}" >> "${GITHUB_OUTPUT}"

      - name: Reclaim closed-PR AI Gateways
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN_PR_EXCLUSIONS: ${{ steps.active.outputs.open_prs }}
        run: node scripts/cloudflare/reclaim-ai-gateways.mjs
