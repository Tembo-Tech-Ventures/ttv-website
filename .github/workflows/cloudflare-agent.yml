name: Cloudflare Agent Environment

on:
  workflow_dispatch:
    inputs:
      action:
        description: Whether to deploy or destroy the isolated environment
        required: true
        type: choice
        options:
          - deploy
          - destroy
      environment_name:
        description: Required agent-prefixed name, for example agent-abc123
        required: true
        type: string

jobs:
  agent:
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: ttv-cloudflare-${{ inputs.environment_name }}
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
      CLOUDFLARE_AI_GATEWAY_TOKEN: ${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEN }}
      CLOUDFLARE_APP_NAME: ttv-website
      CLOUDFLARE_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      CLOUDFLARE_AGENT_AUTH_ENABLED: true
      CLOUDFLARE_PROTECTED_ENVIRONMENTS: production,prod,staging

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Validate isolated environment name
        run: npm run cf:agent -- context

      - if: ${{ inputs.action == 'deploy' }}
        id: deploy
        run: npm run cf:agent -- deploy

      - if: ${{ inputs.action == 'deploy' }}
        name: Install browser
        run: npx playwright install --with-deps chromium

      - if: ${{ inputs.action == 'deploy' }}
        name: Verify live browser journeys
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.better_auth_url }}
          EXPECTED_DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment_name }}
          EXPECTED_DEPLOYMENT_VERSION: ${{ github.sha }}
          STAGING_AGENT_TOKEN: ${{ secrets.STAGING_AGENT_TOKEN }}
        run: npm run test:e2e

      - if: ${{ inputs.action == 'destroy' }}
        run: npm run cf:agent -- destroy
