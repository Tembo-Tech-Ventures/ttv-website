name: Cloudflare Agent Environment

on:
  workflow_dispatch:
    inputs:
      action:
        description: Whether to deploy or destroy the isolated environment
        required: true
        type: choice
        options:
          - deploy
          - destroy
      environment_name:
        description: Required agent-prefixed name, for example agent-abc123
        required: true
        type: string

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: ttv-cloudflare-${{ inputs.environment_name }}
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AGENT_PREVIEW_SECRET: ${{ secrets.AGENT_PREVIEW_SECRET }}
      CLOUDFLARE_APP_NAME: ttv-website
      CLOUDFLARE_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      CLOUDFLARE_AGENT_AUTH_ENABLED: true
      CLOUDFLARE_PROTECTED_ENVIRONMENTS: production,prod,staging

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Validate isolated environment name
        run: npm run cf:agent -- context

      # `tsc --noEmit` type-checks zero .astro files — documented Astro
      # behaviour, not a misconfiguration. Only `astro check` reads them, and it
      # needs Cloudflare credentials because `astro sync` opens a remote proxy
      # session for the always-remote `ai` and `vectorize` bindings. This job is
      # the earliest place in the pipeline that has them.
      - name: Type check .astro files
        run: npm run typecheck:astro

      - if: ${{ inputs.action == 'deploy' }}
        id: deploy
        run: npm run cf:agent -- deploy

      - if: ${{ inputs.action == 'deploy' }}
        name: Install browser
        run: npx playwright install --with-deps chromium

      - if: ${{ inputs.action == 'deploy' }}
        name: Verify live browser journeys and capture Worker logs
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.better_auth_url }}
          EXPECTED_DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment_name }}
          EXPECTED_DEPLOYMENT_VERSION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/cloudflare-worker-tail.log"
          npx wrangler tail "${{ steps.deploy.outputs.worker_name }}" --format pretty > "${log_file}" 2>&1 &
          tail_pid=$!
          cleanup() {
            kill "${tail_pid}" 2>/dev/null || true
            wait "${tail_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 3
          npm run test:e2e

      - if: ${{ always() && inputs.action == 'deploy' }}
        name: Upload live verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-evidence-${{ inputs.environment_name }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            web/test-results
            ${{ runner.temp }}/cloudflare-worker-tail.log

      - if: ${{ inputs.action == 'destroy' }}
        run: npm run cf:agent -- destroy
