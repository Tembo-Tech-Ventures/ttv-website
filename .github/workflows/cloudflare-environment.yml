name: Cloudflare Environment

on:
  workflow_call:
    inputs:
      action:
        required: true
        type: string
      environment_name:
        required: true
        type: string
      app_name:
        required: false
        type: string
        default: ttv-website
      primary_domain:
        required: false
        type: string
        default: ""
      redirect_domain:
        required: false
        type: string
        default: ""
      better_auth_url:
        required: false
        type: string
        default: ""
      agent_auth_enabled:
        required: false
        type: boolean
        default: false
      workers_subdomain:
        required: false
        type: string
        default: ""
      d1_jurisdiction:
        required: false
        type: string
        default: ""
      r2_jurisdiction:
        required: false
        type: string
        default: ""
      r2_location_hint:
        required: false
        type: string
        default: ""
      protected_environments:
        required: false
        type: string
        default: production,prod
      allow_protected_destroy:
        required: false
        type: boolean
        default: false
      github_environment:
        required: false
        type: string
        default: ""

jobs:
  cloudflare-with-environment:
    if: ${{ inputs.github_environment != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.github_environment }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BETTER_AUTH_SECRET: ${{ !startsWith(inputs.environment_name, 'agent-') && secrets.BETTER_AUTH_SECRET || '' }}
      GITHUB_CLIENT_ID: ${{ !startsWith(inputs.environment_name, 'agent-') && secrets.GH_CLIENT_ID || '' }}
      GITHUB_CLIENT_SECRET: ${{ !startsWith(inputs.environment_name, 'agent-') && secrets.GH_CLIENT_SECRET || '' }}
      CLOUDFLARE_AI_GATEWAY_TOKEN: ${{ !startsWith(inputs.environment_name, 'agent-') && secrets.CLOUDFLARE_AI_GATEWAY_TOKEN || '' }}
      SAM_ALERT_WEBHOOK_URL: ${{ !startsWith(inputs.environment_name, 'agent-') && vars.SAM_ALERT_WEBHOOK_URL || '' }}
      SAM_ALERT_WEBHOOK_TOKEN: ${{ !startsWith(inputs.environment_name, 'agent-') && secrets.SAM_ALERT_WEBHOOK_TOKEN || '' }}
      CREDENTIALS_ENCRYPTION_KEY: ${{ !startsWith(inputs.environment_name, 'agent-') && secrets.CREDENTIALS_ENCRYPTION_KEY || '' }}
      AGENT_PREVIEW_SECRET: ${{ startsWith(inputs.environment_name, 'agent-') && secrets.AGENT_PREVIEW_SECRET || '' }}
      CLOUDFLARE_APP_NAME: ${{ inputs.app_name }}
      CLOUDFLARE_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
      CLOUDFLARE_PRIMARY_DOMAIN: ${{ inputs.primary_domain }}
      CLOUDFLARE_REDIRECT_DOMAIN: ${{ inputs.redirect_domain }}
      CLOUDFLARE_BETTER_AUTH_URL: ${{ inputs.better_auth_url }}
      CLOUDFLARE_AGENT_AUTH_ENABLED: ${{ inputs.agent_auth_enabled }}
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ inputs.workers_subdomain }}
      CLOUDFLARE_D1_JURISDICTION: ${{ inputs.d1_jurisdiction }}
      CLOUDFLARE_R2_JURISDICTION: ${{ inputs.r2_jurisdiction }}
      CLOUDFLARE_R2_LOCATION_HINT: ${{ inputs.r2_location_hint }}
      CLOUDFLARE_PROTECTED_ENVIRONMENTS: ${{ inputs.protected_environments }}
      CLOUDFLARE_ALLOW_PROTECTED_DESTROY: ${{ inputs.allow_protected_destroy }}
      PLAYWRIGHT_AGENT_TOKEN: ${{ inputs.environment_name == 'staging' && secrets.STAGING_AGENT_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --legacy-peer-deps

      # `tsc --noEmit` ignores .astro files. `astro check` must run here because
      # Astro sync opens the remote Cloudflare binding proxy.
      - if: ${{ inputs.action == 'deploy' }}
        name: Type check .astro files
        run: npm run typecheck:astro

      - if: ${{ inputs.action == 'deploy' && inputs.environment_name == 'production' }}
        id: rollback_target
        name: Capture production rollback target
        run: npm run cf:rollback -- capture --environment="${{ inputs.environment_name }}" --worker-name="${{ inputs.app_name }}-${{ inputs.environment_name }}" --health-url="${{ inputs.better_auth_url }}/api/health"

      - if: ${{ inputs.action == 'deploy' }}
        id: deploy
        run: npm run cf:deploy

      - if: ${{ inputs.action == 'deploy' }}
        id: smoke
        name: Verify deployment identity and public routes
        continue-on-error: ${{ inputs.environment_name == 'production' }}
        run: npm run cf:smoke -- --base-url="${{ steps.deploy.outputs.better_auth_url }}" --expected-environment="${{ inputs.environment_name }}" --expected-version="$GITHUB_SHA"

      - if: ${{ inputs.action == 'deploy' }}
        id: browser_install
        name: Install browser
        continue-on-error: ${{ inputs.environment_name == 'production' }}
        run: npx playwright install --with-deps chromium

      - if: ${{ inputs.action == 'deploy' }}
        id: browser
        name: Verify live browser journeys and capture Worker logs
        continue-on-error: ${{ inputs.environment_name == 'production' }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.better_auth_url }}
          EXPECTED_DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment_name }}
          EXPECTED_DEPLOYMENT_VERSION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/cloudflare-worker-tail.log"
          npx wrangler tail "${{ steps.deploy.outputs.worker_name }}" --format pretty > "${log_file}" 2>&1 &
          tail_pid=$!
          cleanup() {
            kill "${tail_pid}" 2>/dev/null || true
            wait "${tail_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 3
          npm run test:e2e

      - if: ${{ always() && inputs.action == 'deploy' && inputs.environment_name == 'production' && (steps.smoke.outcome == 'failure' || steps.browser_install.outcome == 'failure' || steps.browser.outcome == 'failure') }}
        id: rollback
        name: Roll back failed production verification
        continue-on-error: true
        run: npm run cf:rollback -- rollback --environment="${{ inputs.environment_name }}" --worker-name="${{ steps.deploy.outputs.worker_name }}" --version-id="${{ steps.rollback_target.outputs.worker_version_id }}"

      - if: ${{ always() && steps.rollback.outcome == 'success' }}
        id: rollback_smoke
        name: Verify production rollback
        continue-on-error: true
        run: npm run cf:smoke -- --base-url="${{ steps.deploy.outputs.better_auth_url }}" --expected-environment="production" --expected-version="${{ steps.rollback_target.outputs.health_version }}"

      - if: ${{ always() && inputs.action == 'deploy' }}
        name: Upload live verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-evidence-${{ inputs.environment_name }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            web/test-results
            ${{ runner.temp }}/cloudflare-worker-tail.log

      - if: ${{ always() && inputs.action == 'deploy' && inputs.environment_name == 'production' && (steps.smoke.outcome == 'failure' || steps.browser_install.outcome == 'failure' || steps.browser.outcome == 'failure') }}
        name: Fail production deployment after rollback
        shell: bash
        run: |
          {
            echo "## Production verification failed"
            echo "Smoke: ${{ steps.smoke.outcome }}; browser install: ${{ steps.browser_install.outcome }}; browser journeys: ${{ steps.browser.outcome }}."
            echo "Rollback: ${{ steps.rollback.outcome }}; rollback smoke: ${{ steps.rollback_smoke.outcome }}."
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${{ steps.rollback.outcome }}" != "success" || "${{ steps.rollback_smoke.outcome }}" != "success" ]]; then
            echo "::error::Production verification failed and the automatic rollback did not verify successfully."
          else
            echo "::error::Production verification failed. The previous Worker version was restored and verified."
          fi
          exit 1

      - if: ${{ failure() && inputs.action == 'deploy' && inputs.environment_name == 'production' }}
        name: Notify SAM of production failure
        env:
          SAM_ALERT_WEBHOOK_URL: ${{ vars.SAM_ALERT_WEBHOOK_URL }}
          SAM_ALERT_WEBHOOK_TOKEN: ${{ secrets.SAM_ALERT_WEBHOOK_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${SAM_ALERT_WEBHOOK_URL}" || -z "${SAM_ALERT_WEBHOOK_TOKEN}" ]]; then
            echo "::notice::SAM deploy alert skipped because SAM_ALERT_WEBHOOK_URL or SAM_ALERT_WEBHOOK_TOKEN is unset."
            exit 0
          fi
          npm run cf:notify-sam -- \
            --kind="${{ (steps.rollback.outcome == 'failure' || steps.rollback_smoke.outcome == 'failure') && 'rollback.failed' || 'deploy.failed' }}" \
            --environment="${{ inputs.environment_name }}" \
            --version="$GITHUB_SHA" \
            --run-id="${{ github.run_id }}" \
            --run-attempt="${{ github.run_attempt }}" \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --health-url="${{ inputs.better_auth_url }}/api/health" \
            --message="Production deployment failed; see the GitHub Actions run for verification and rollback details."

      - if: ${{ inputs.action == 'destroy' }}
        run: npm run cf:destroy

  cloudflare:
    if: ${{ inputs.github_environment == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BETTER_AUTH_SECRET: ${{ !startsWith(inputs.environment_name, 'agent-') && secrets.BETTER_AUTH_SECRET || '' }}
      GITHUB_CLIENT_ID: ${{ !startsWith(inputs.environment_name, 'agent-') && secrets.GH_CLIENT_ID || '' }}
      GITHUB_CLIENT_SECRET: ${{ !startsWith(inputs.environment_name, 'agent-') && secrets.GH_CLIENT_SECRET || '' }}
      CLOUDFLARE_AI_GATEWAY_TOKEN: ${{ !startsWith(inputs.environment_name, 'agent-') && secrets.CLOUDFLARE_AI_GATEWAY_TOKEN || '' }}
      SAM_ALERT_WEBHOOK_URL: ${{ !startsWith(inputs.environment_name, 'agent-') && vars.SAM_ALERT_WEBHOOK_URL || '' }}
      SAM_ALERT_WEBHOOK_TOKEN: ${{ !startsWith(inputs.environment_name, 'agent-') && secrets.SAM_ALERT_WEBHOOK_TOKEN || '' }}
      CREDENTIALS_ENCRYPTION_KEY: ${{ !startsWith(inputs.environment_name, 'agent-') && secrets.CREDENTIALS_ENCRYPTION_KEY || '' }}
      AGENT_PREVIEW_SECRET: ${{ startsWith(inputs.environment_name, 'agent-') && secrets.AGENT_PREVIEW_SECRET || '' }}
      CLOUDFLARE_APP_NAME: ${{ inputs.app_name }}
      CLOUDFLARE_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
      CLOUDFLARE_PRIMARY_DOMAIN: ${{ inputs.primary_domain }}
      CLOUDFLARE_REDIRECT_DOMAIN: ${{ inputs.redirect_domain }}
      CLOUDFLARE_BETTER_AUTH_URL: ${{ inputs.better_auth_url }}
      CLOUDFLARE_AGENT_AUTH_ENABLED: ${{ inputs.agent_auth_enabled }}
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ inputs.workers_subdomain }}
      CLOUDFLARE_D1_JURISDICTION: ${{ inputs.d1_jurisdiction }}
      CLOUDFLARE_R2_JURISDICTION: ${{ inputs.r2_jurisdiction }}
      CLOUDFLARE_R2_LOCATION_HINT: ${{ inputs.r2_location_hint }}
      CLOUDFLARE_PROTECTED_ENVIRONMENTS: ${{ inputs.protected_environments }}
      CLOUDFLARE_ALLOW_PROTECTED_DESTROY: ${{ inputs.allow_protected_destroy }}
      PLAYWRIGHT_AGENT_TOKEN: ${{ inputs.environment_name == 'staging' && secrets.STAGING_AGENT_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
