name: Cloudflare Staging Gateway Setup
on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact reviewed integration PR171 head; PM setup slot required
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
# Only the existing dispatcher calls this; its concurrency lock covers all jobs.
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check exact integration revision before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_ACTION: gateway-setup
          STAGING_EXPECTED_SHA: ${{ inputs.expected_sha }}
          STAGING_INTEGRATION_BRANCH: sam/use-sam-mcp-tools-m8a3jp
          STAGING_INTEGRATION_PR: "171"
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          node web/scripts/cloudflare/staging-preflight.mjs
  setup:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Create one narrow token and bind directly in memory
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_ACTION: gateway-setup
          STAGING_EXPECTED_SHA: ${{ inputs.expected_sha }}
          STAGING_INTEGRATION_BRANCH: sam/use-sam-mcp-tools-m8a3jp
          STAGING_INTEGRATION_PR: "171"
          CLOUDFLARE_ENVIRONMENT_NAME: staging
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/scripts/cloudflare/staging-gateway-setup.mjs
