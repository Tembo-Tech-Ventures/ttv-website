name: Cloudflare Staging Credential Metadata Audit
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed integration PR171 head
        required: true
        type: string
      token_kind:
        description: Known token owner kind; never retry denied requests with another kind
        required: true
        type: choice
        options: [user, account]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ttv-cloudflare-staging
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check reviewed integration revision before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_EXPECTED_SHA: ${{ inputs.expected_sha }}
          STAGING_INTEGRATION_BRANCH: sam/use-sam-mcp-tools-m8a3jp
          STAGING_INTEGRATION_PR: "171"
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          node web/scripts/cloudflare/staging-preflight.mjs
  audit:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read credential metadata only
        env:
          CLOUDFLARE_ENVIRONMENT_NAME: staging
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUDIT_TOKEN_KIND: ${{ inputs.token_kind }}
        run: node web/scripts/cloudflare/staging-credential-audit.mjs
