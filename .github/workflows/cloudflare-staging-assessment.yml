name: Cloudflare Staging Synthetic Assessment

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact deployed integration PR 171 head; requires a new PM assessment slot
        required: true
        type: string

# Caller holds the shared staging concurrency lock. Never retry this paid probe.
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require exact integration revision and first attempt before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_EXPECTED_SHA: ${{ inputs.expected_sha }}
          STAGING_INTEGRATION_BRANCH: sam/use-sam-mcp-tools-m8a3jp
          STAGING_INTEGRATION_PR: "171"
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          node web/scripts/cloudflare/staging-preflight.mjs
  assess:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Verify deployed assessment once using synthetic institutions
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_EXPECTED_SHA: ${{ inputs.expected_sha }}
          STAGING_INTEGRATION_BRANCH: sam/use-sam-mcp-tools-m8a3jp
          STAGING_INTEGRATION_PR: "171"
          CLOUDFLARE_ENVIRONMENT_NAME: staging
          CLOUDFLARE_APP_NAME: ttv-website
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
        run: node scripts/cloudflare/staging-assessment.mjs
      - name: Publish sanitized assessment metadata only after fixture cleanup
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-assessment-${{ inputs.expected_sha }}-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: web/test-results/staging-assessment/manifest.json
      - name: Publish allowlisted failure diagnostics without response bodies
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-assessment-failure-${{ inputs.expected_sha }}-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: web/test-results/staging-assessment/failure.json
