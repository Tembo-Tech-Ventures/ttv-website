name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --legacy-peer-deps

      - run: npm run lint

      - run: npm run typecheck

      # Dead files and unreferenced dependencies. Scoped to files/dependencies
      # for now — unused *exports* has a backlog of 31 that predates this and is
      # not worth blocking on until it is triaged.
      - run: npm run knip

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --legacy-peer-deps

      - run: npm test

      - run: npm run test:e2e:list

  security:
    name: Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --legacy-peer-deps

      - run: npm run audit:ci
