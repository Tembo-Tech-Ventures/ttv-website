name: Cloudflare PR Preview

on:
  pull_request:
    branches:
      - main
      - staging
    types:
      - opened
      - reopened
      - synchronize
      - closed

jobs:
  preview:
    concurrency:
      group: ttv-cloudflare-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/cloudflare-environment.yml
    with:
      action: ${{ github.event.action == 'closed' && 'destroy' || 'deploy' }}
      environment_name: agent-pr-${{ github.event.pull_request.number }}
      github_environment: staging
      agent_auth_enabled: true
      workers_subdomain: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      protected_environments: production,prod,staging
    secrets: inherit
